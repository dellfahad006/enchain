name: Build WebGL (Buildalon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQN
          df -h /

      - name: Install FFmpeg, XVFB, and libtinfo5
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libtinfo5 || true
          if [ ! -e /lib/x86_64-linux-gnu/libtinfo.so.5 ] && [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -s /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

      - name: Fix WebGL template and remove broken compute shaders
        run: |
          sed -i -E 's/^(\s*webGLTemplate:).*$/\1 APPLICATION:Default/' project/ProjectSettings/ProjectSettings.asset
          rm -rf project/Assets/ComputeShader project/Assets/ComputeShader.meta

      - name: Setup Unity Editor
        uses: buildalon/unity-setup@v3
        with:
          version-file: 'None'
          unity-version: '2020.3.40f1 (ba48d4efcef1)'
          build-targets: 'WebGL'
          allow-security-alert: true
          cache-installation: true

      - name: Activate Unity Personal License
        uses: buildalon/activate-unity-license@v3
        with:
          license: 'personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Add Buildalon Build Pipeline Package
        working-directory: project
        run: |
          npm install -g openupm-cli
          openupm add --force com.virtualmaker.buildalon

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: project/Library
          key: Library-WebGL-2020.3.40f1-v2-${{ hashFiles('project/Assets/**', 'project/Packages/**', 'project/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-2020.3.40f1-v2-

      - name: Build WebGL Project
        run: |
          mkdir -p project/Builds/Logs
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            /home/runner/Unity/Hub/Editor/2020.3.40f1/Editor/Unity \
            -projectPath project \
            -logFile "$GITHUB_WORKSPACE/unity-build.log" \
            -automated \
            -buildTarget WebGL \
            -quit -batchmode \
            -job-worker-count 1 \
            -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.StartCommandLineBuild

      - name: Show end of Unity log if failed
        if: failure()
        run: tail -n 120 unity-build.log | cut -c1-300

      - name: Upload Unity diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-diagnostic-logs
          path: unity-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare WebGL build folder
        run: |
          set -e
          mapfile -t INDEX_FILES < <(find project/Builds -name index.html -type f)
          BUILD_DIR="$(dirname "${INDEX_FILES[0]}")"
          mkdir -p pages-artifact
          cp -a "$BUILD_DIR/." pages-artifact/
          test -f pages-artifact/index.html

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: pages-artifact

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
